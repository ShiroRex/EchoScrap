<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EchoScrap · Ranking</title>
<link rel="stylesheet" href="ranking.css"><main><header class="mast"><h1>EchoScrap <em>Ranking</em></h1></header><section class="ledger"><div class="bar"><strong>Clasificación general</strong></div><table aria-label="Clasificación por puntaje"><thead><tr><th>Puesto</th><th>Jugador</th><th class="extra">Bajas</th><th>Tiempo</th><th>Puntos</th></tr></thead><tbody id="rows"></tbody></table><p id="message" role="status">Cargando partidas…</p></section><section id="live-section" class="ledger" style="margin-top:32px" hidden><div class="bar"><strong>Expediciones en directo</strong></div><table aria-label="Expediciones activas fuera de la clasificación oficial"><thead><tr><th>Estado</th><th>Jugador</th><th class="extra">Bajas</th><th>Tiempo</th><th>Puntos</th></tr></thead><tbody id="live-rows"></tbody></table></section></main>

<script type="module">
const rows=document.querySelector('#rows'), liveRows=document.querySelector('#live-rows'), liveSection=document.querySelector('#live-section'), message=document.querySelector('#message');
const numbers=new Intl.NumberFormat('es-MX');
const integer=v=>Number.isFinite(v)?Math.max(0,Math.floor(v)):0;
const normalizeGamertag=name=>String(name??'').normalize('NFKC').trim().replace(/\s+/gu,' ').toUpperCase();
const effectiveScore=p=>Number.isFinite(p?.score)?Math.max(0,Math.floor(p.score)):(Number.isFinite(p?.rawScore)?Math.max(0,Math.floor(p.modeMinutes===8?p.rawScore/2:p.rawScore)):NaN);
const recordTime=p=>Number.isFinite(p?.updatedAt)&&p.updatedAt>0?p.updatedAt:(Number.isFinite(p?.heartbeat)?p.heartbeat:Number.MAX_SAFE_INTEGER);
const liveTime=p=>Number.isFinite(p?.heartbeat)?p.heartbeat:(Number.isFinite(p?.updatedAt)?p.updatedAt:0);
const isBetterFinal=(candidate,previous)=>candidate.score>previous.score||(candidate.score===previous.score&&(candidate.time<previous.time||(candidate.time===previous.time&&candidate.id.localeCompare(previous.id)<0)));
let latestRecords={}, serverOffset=0;
const activeLifetime=30000;
function appendRows(tbody,entries,isOfficial){
 const frag=document.createDocumentFragment();let rank=0,previousScore=null;
 entries.forEach((entry,i)=>{
  const p=entry.p, score=entry.score;
  if(isOfficial&&previousScore!==score)rank=i+1;
  if(isOfficial)previousScore=score;
  const tr=document.createElement('tr');
  if(isOfficial)tr.classList.toggle('leader',rank===1);
  const seconds=integer(p.survivalSeconds), badge=isOfficial?'#'+rank:'EN VIVO';
  for(const [index,value] of [badge,p.playerName||'Jugador',integer(p.kills),Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0'),numbers.format(score)].entries()){
   const td=document.createElement('td');if(index===2)td.className='extra';td.textContent=value;
   if(index===1){const detail=document.createElement('small');detail.className='state';detail.dataset.active=String(p.status==='EN PARTIDA');detail.textContent=p.modeMinutes+' MIN · '+p.status;td.append(detail);}
   tr.append(td);
  }
  frag.append(tr);
 });
 tbody.replaceChildren(frag);
}
function render(records){
 const bestByName=new Map(), liveByName=new Map(), now=Date.now()+serverOffset;
 for(const [id,p] of Object.entries(records??{})){
  const score=effectiveScore(p);
  if(p?.rulesVersion!==2 || !Number.isFinite(score) || typeof p.playerName!=='string')continue;
  const key=p.gamertagNormalized || normalizeGamertag(p.playerName);
  if(!key)continue;
  if(p.status==='EN PARTIDA'){
   const time=liveTime(p);
   if(now-time>=activeLifetime)continue;
   const prevLive=liveByName.get(key);
   if(!prevLive || time>prevLive.time || (time===prevLive.time && id.localeCompare(prevLive.id)<0))
    liveByName.set(key,{id,p,score,time});
   continue;
  }
  if(!['VICTORIA','DERROTA'].includes(p.status))continue;
  const candidate={id,p,score,time:recordTime(p)};
  const prevBest=bestByName.get(key);
  if(!prevBest || isBetterFinal(candidate,prevBest))
   bestByName.set(key,candidate);
 }
 const sessions=Array.from(bestByName.values()).sort((a,b)=>(b.score-a.score)||(a.time-b.time)||a.id.localeCompare(b.id));
 const liveSessions=Array.from(liveByName.values()).sort((a,b)=>(b.score-a.score)||(b.time-a.time)||a.id.localeCompare(b.id));
 appendRows(rows,sessions,true);
 appendRows(liveRows,liveSessions,false);
 if(liveSection)liveSection.hidden=liveSessions.length===0;
 message.textContent=sessions.length?'':'La clasificación espera su primera expedición.';
 return {sessions,liveSessions};
}
window.EchoScrapRanking={normalizeGamertag,effectiveScore,render};
try{
 const firebaseConfig = {
      apiKey: "AIzaSyBgdPPFayt0SzNf95YMdTnONFtpZd2DflA",
      authDomain: "echoscrap.firebaseapp.com",
      databaseURL: "https://echoscrap-default-rtdb.firebaseio.com",
      projectId: "echoscrap",
      storageBucket: "echoscrap.firebasestorage.app",
      messagingSenderId: "214636478609",
      appId: "1:214636478609:web:c819b0f088bc397c4e3f30",
      measurementId: "G-RX2N267SV0"
    };
 const [{initializeApp},{getDatabase,ref,onValue}]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js')]);
 const db=getDatabase(initializeApp(firebaseConfig));
 onValue(ref(db,'.info/serverTimeOffset'),snapshot=>{serverOffset=snapshot.val()||0;});
 onValue(ref(db,'players'),snapshot=>{latestRecords=snapshot.val()??{};render(latestRecords);},()=>{
   latestRecords={};rows.replaceChildren();
   message.textContent='No se pudo consultar la clasificación.';
 });
 setInterval(()=>{if(Object.values(latestRecords).some(p=>p?.status==='EN PARTIDA'))render(latestRecords);},5000);
}catch{message.textContent='Comprueba tu conexión a internet y vuelve a cargar la página.';}
</script></html>
